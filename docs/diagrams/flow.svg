<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">One request through Pipeline.respond in ai-guardrails-and-red-team</title>
<desc id="d">Ten rows across the Customer, Redaction, Input guard, Assistant and Output guard lanes. The message is redacted and passes the input guard, the assistant looks up and scans outside data and calls the model, and the output guard checks the reply before the own values are restored and scrubbed. Three warning rows show the three places a request is refused with a reason code. The suite ends by counting attacks that worked, which is 0 of 300 runs.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="899" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="898" rx="16"/>
<text class="title" x="48" y="68">One message through the guards</text>
<text class="caption" x="48" y="100">Amber: the three places a request is refused, at the input, at the data scan and at the output.</text>

<rect class="actor" x="406" y="128" width="100" height="48" rx="24"/>
<text class="lane" x="456" y="158" text-anchor="middle">Customer</text>
<rect class="svc" x="536" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="596" y="158" text-anchor="middle">Redaction</text>
<rect class="svc" x="674" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="744" y="158" text-anchor="middle">Input guard</text>
<rect class="svc" x="834" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="894" y="158" text-anchor="middle">Assistant</text>
<rect class="svc" x="981" y="128" width="150" height="48" rx="10"/>
<text class="lane" x="1056" y="158" text-anchor="middle">Output guard</text>
<path class="hair" d="M456 176V816M596 176V816M744 176V432M894 176V624M1056 176V752"/>
<path class="hair" d="M66 216V792"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Redact the message</text>
<text class="sub" x="96" y="232">emails, cards, phones to tokens</text>
<path class="sync" d="M456 216H596"/>
<text class="label t-accent" x="468" y="206">message</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Run the input guard</text>
<text class="sub" x="96" y="296">rules, then the classifier</text>
<path class="sync" d="M596 280H744"/>
<text class="label t-accent" x="608" y="270">text</text>
<circle class="dot-w" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">2x</text>
<text class="label b t-warn" x="96" y="340">A rule hits: block</text>
<text class="sub" x="96" y="360">the rule names are the reasons</text>
<path class="fail" d="M744 344H456"/>
<text class="label t-warn" x="468" y="334">refusal</text>
<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="404">Look up and scan the data</text>
<text class="sub" x="96" y="424">find_order, help page, same rules</text>
<path class="sync" d="M744 408H894"/>
<text class="label t-accent" x="756" y="398">allow</text>
<circle class="dot-w" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="468">The outside data trips it</text>
<text class="sub" x="96" y="488">an injection in a note or page</text>
<path class="fail" d="M894 472H456"/>
<text class="label t-warn" x="468" y="462">refusal</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="532">One model call</text>
<text class="sub" x="96" y="552">canary in the system prompt</text>
<rect class="slot" x="888" y="518" width="12" height="36" rx="5"/>
<text class="label t-accent" x="910" y="541">model call</text>
<circle class="dot" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="596">Check the raw reply</text>
<text class="sub" x="96" y="616">canary, other ids, prompt overlap</text>
<path class="sync" d="M894 600H1056"/>
<text class="label t-accent" x="906" y="590">raw reply</text>
<circle class="dot-w" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="660">The output guard blocks</text>
<text class="sub" x="96" y="680">the backstop for new wording</text>
<path class="fail" d="M1056 664H456"/>
<text class="label t-warn" x="468" y="654">refusal</text>
<circle class="dot" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="724">Restore, then scrub</text>
<text class="sub" x="96" y="744">own values back, strays removed</text>
<path class="sync" d="M1056 728H596"/>
<text class="label t-accent" x="608" y="718">pass</text>
<circle class="dot-g" cx="66" cy="792" r="15"/><text class="num" x="66" y="797" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="788">Count what worked</text>
<text class="sub" x="96" y="808">attack_effect on the final reply</text>
<path class="ok" d="M596 792H456"/>
<text class="label t-good" x="468" y="782">reply</text>
<rect class="win" x="700" y="772" width="380" height="40" rx="10"/>
<text class="label b t-good" x="716" y="797">attacks that worked: 0 of 300 runs</text>

<path class="sync" d="M48 856H112"/><text class="legend" x="124" y="861">sync call</text>
<path class="fail" d="M696 856H760"/><text class="legend" x="772" y="861">failure path</text>
<path class="ok" d="M928 856H992"/><text class="legend" x="1004" y="861">result</text>
</svg>
