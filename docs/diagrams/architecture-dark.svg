<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="t d">
<title id="t">Architecture of ai-guardrails-and-red-team</title>
<desc id="d">In the Pipeline.respond boundary a message is redacted, passes the input guard, reaches the Assistant, which looks up outside data and calls the model, then passes the output guard and is restored and scrubbed. Any block at the input, the data scan or the output ends in a designed refusal with a reason code. The suites send requests in and a release gate compares the rates. The assistant reads find_order data and calls a ChatModel.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="929" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="928" rx="16"/>
<text class="title" x="48" y="68">Guards around a support assistant, tested by effects</text>
<text class="caption" x="48" y="100">Every guard is a flag on one pipeline. The output guard is the backstop that checks what actually leaves.</text>

<rect class="boundary" x="264" y="132" width="304" height="740" rx="14"/>
<text class="tag" x="280" y="160">Pipeline.respond</text>
<rect class="svc" x="288" y="176" width="256" height="72" rx="12"/>
<text class="name" x="304" y="208">Redact in</text>
<text class="sub" x="304" y="232">typed placeholders</text>
<rect class="svc" x="288" y="288" width="256" height="94" rx="12"/>
<text class="name" x="304" y="320">Input guard</text>
<text class="sub" x="304" y="344">rules.py, guards.py</text>
<text class="sub" x="304" y="366">classifier, soft signals</text>
<rect class="svc" x="288" y="426" width="256" height="150" rx="12"/>
<text class="name" x="304" y="458">Assistant</text>
<text class="sub" x="304" y="482">assistant.py</text>
<text class="sub" x="304" y="504">tool step, data scan</text>
<text class="sub" x="304" y="526">one model call</text>
<rect class="svc" x="288" y="620" width="256" height="116" rx="12"/>
<text class="name" x="304" y="652">Output guard</text>
<text class="sub" x="304" y="676">output_checks.py</text>
<text class="sub" x="304" y="698">canary, other ids</text>
<text class="sub" x="304" y="720">prompt overlap</text>
<rect class="svc" x="288" y="780" width="256" height="72" rx="12"/>
<text class="name" x="304" y="812">Restore, scrub</text>
<text class="sub" x="304" y="836">own values only</text>
<rect class="actor" x="656" y="176" width="168" height="72" rx="36"/>
<text class="name" x="740" y="208" text-anchor="middle">Customer</text>
<text class="sub" x="740" y="230" text-anchor="middle">message or attack</text>
<rect class="svc" x="656" y="296" width="232" height="420" rx="12"/>
<text class="name" x="672" y="328">Designed refusal</text>
<text class="sub" x="672" y="352">fixed reply</text>
<text class="sub" x="672" y="374">input, data, output</text>
<text class="sub" x="672" y="396">reason code each</text>
<rect class="note" x="952" y="330" width="200" height="116" rx="10"/>
<text class="label b t-warn" x="968" y="360">make gate-weakened</text>
<text class="sub" x="968" y="386">remove_guards: all</text>
<text class="sub" x="968" y="408">five families named</text>
<text class="sub" x="968" y="430">with their case ids</text>
<rect class="svc" x="48" y="176" width="184" height="108" rx="12"/>
<text class="name" x="64" y="208">Suites</text>
<text class="sub" x="64" y="232">suites.py</text>
<text class="sub" x="64" y="254">100 attacks</text>
<text class="sub" x="64" y="276">100 benign</text>
<rect class="svc" x="48" y="320" width="184" height="84" rx="12"/>
<text class="name" x="64" y="352">Release gate</text>
<text class="sub" x="64" y="376">gate.py</text>
<text class="sub" x="64" y="398">recorded rates</text>
<path class="store" d="M48 442a92 12 0 0 1 184 0v76a92 12 0 0 1 -184 0z"/>
<path class="rim" d="M48 442a92 12 0 0 0 184 0"/>
<text class="name" x="140" y="470" text-anchor="middle">Outside data</text>
<text class="sub" x="140" y="492" text-anchor="middle">order, help page</text>
<rect class="svc" x="48" y="556" width="184" height="116" rx="12"/>
<text class="name" x="64" y="588">ChatModel</text>
<text class="sub" x="64" y="612">recorded</text>
<text class="sub" x="64" y="634">openai_compat</text>
<text class="sub" x="64" y="656">anthropic</text>
<path class="sync" d="M232 212H288"/>
<path class="sync" d="M140 284V320"/>
<path class="sync" d="M656 212H544"/>
<text class="label t-accent" x="576" y="202">message</text>
<path class="sync" d="M416 248V288"/>
<path class="sync" d="M416 382V426"/>
<text class="label t-accent" x="428" y="410">allow</text>
<path class="sync" d="M416 576V620"/>
<text class="label t-accent" x="428" y="604">reply</text>
<path class="sync" d="M416 736V780"/>
<text class="label t-accent" x="428" y="764">pass</text>
<path class="fail" d="M544 340H656"/>
<text class="label t-warn" x="576" y="330">block</text>
<path class="fail" d="M544 500H656"/>
<text class="label t-warn" x="576" y="490">data</text>
<path class="fail" d="M544 676H656"/>
<text class="label t-warn" x="576" y="666">block</text>
<path class="fail" d="M772 296V248"/>
<text class="label t-warn" x="784" y="278">refusal</text>
<path class="ok" d="M544 816H928Q940 816 940 804V224Q940 212 928 212H824"/>
<text class="label t-good" x="580" y="806">reply</text>
<path class="read" d="M232 482H288"/>
<path class="sync" d="M288 566H232"/>

<path class="sync" d="M48 886H112"/><text class="legend" x="124" y="891">sync call</text>
<path class="read" d="M520 886H584"/><text class="legend" x="596" y="891">read</text>
<path class="fail" d="M696 886H760"/><text class="legend" x="772" y="891">failure path</text>
<path class="ok" d="M928 886H992"/><text class="legend" x="1004" y="891">result</text>
</svg>
